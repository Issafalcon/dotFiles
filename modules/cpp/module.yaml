name: cpp
icon: ""
description: C/C++ toolchain (clang, gcc, cmake)
category: Language
website: "https://clang.llvm.org/"
repo: "https://github.com/llvm/llvm-project"
external_deps:
  - name: build-essential
    check_command: dpkg -s build-essential
    install_command: sudo apt-get install -y build-essential
    install_method: apt
  - name: libssl-dev
    check_command: dpkg -s libssl-dev
    install_command: sudo apt-get install -y libssl-dev
    install_method: apt
stow_enabled: true
estimated_time: 1m
estimated_size: 300MB
check_command: clang --version
